location ~ /\. {
    deny all;
}

location /favicon.ico {
    return 301 /public/favicon.ico;
}
location /robots.txt {
    return 301 /public/robots.txt;
}
location /simple_response.json {
    return 301 /public/simple_response.json;
}

location / {
    set $redirect 0;
    if ($http_x_forwarded_proto != "https") {
        set $redirect 1;
    }
    if ($http_user_agent ~* "ELB-HealthChecker") {
        set $redirect 0;
    }
    if ($redirect = 1) {
        return 301 https://$host$request_uri;
    }
    proxy_pass http://my_app; # match the name of upstream directive which is defined /etc/nginx/conf.d/elasticbeanstalk-nginx-ruby-upstream.conf 
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
}

location /images {
    alias /var/app/current/public/images;
    gzip_static on;
    gzip on;
    expires max;
    add_header Cache-Control public;
}

location /public {
    alias /var/app/current/public;
    gzip_static on;
    gzip on;
    expires max;
    add_header Cache-Control public;
}

location /fonts {
    alias /var/app/current/public/fonts;
    gzip_static on;
    gzip on;
    expires max;
    add_header Cache-Control public;
}

location /dist {
    alias /var/app/current/public/dist;
    gzip_static on;
    gzip on;
    expires max;
    add_header Cache-Control public;
}
